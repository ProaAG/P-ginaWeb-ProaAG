<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kavoon&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Estilo/InicioSesion.css">
</head>

<body>
    <header>
        <img class="logo-principal" src="Estilo/Imagenes/Logo PRoA.png" alt="Logo de la pagina" width="100" height="100">
        <div class="header-contenido">
            <h1>Escuela Experimental PRoA sede Alta Gracia</h1>
            <nav>
                <a href="#nos">• Nosotros</a>
                <a href="#not">• Noticias</a>
                <a href="#aca">• Academica</a>
                <a href="#con">• Contacto</a>
                <a href="#doc">• Documentos</a>
            </nav>
        </div>
        <button class="boton-inicio" type="button" onclick="window.location.href='Index.html'">Página principal</button>
    </header>
    <main class="login-container">
        <h1>Iniciar sesión</h1>
        <form id="login-form" action="PhP/login.php" method="POST">
            <div class="form-group">
                <label for="username">
                    Correo electrónico
                </label>
                <input type="email" id="username" name="usuario" required>
            </div>
            <div class="form-group">
                <div class="password-header">
                    <label for="password">Contraseña</label>
                    <a href="#" class="forgot-password" id="forgot-password" onclick="alert('Para recuperar tu contraseña, comunícate con la institución.'); return false;">¿Olvidaste tu contraseña?</a>
                </div>
                <input type="password" id="password" name="contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" id="login-button">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
