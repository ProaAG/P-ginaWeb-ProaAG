<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.google.com/specimen/EB+Garamond" rel="stylesheet">
    <link rel="stylesheet" href="Estilo/Style.css">
    <script src="Java/carrusel.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <img class="logo-principal" src="../PaginaPRoA-Documentacion/logoproa.png" alt="Logo de la pagina" width="100" height="100">

        <div class="header-contenido">
            <h1>Escuela Experimental PRoA sede Alta Gracia</h1>
            <nav>
                <a href="../PaginaPRoA-Nosotros/nosotros.html">• Nosotros</a>
                <a href="../PaginaPRoA-Noticias/novedades.html">• Noticias</a>
                <a href="../PaginaPRoA-Academica/prueba.html">• Academica</a>
                <a href="../PaginaPRoA-Contacto/index.html">• Contacto</a>
                <a href="../PaginaPRoA-Documentacion/principal.html">• Documentos</a>
            </nav>
        </div>
        <button class="boton-inicio" onclick="window.location.href='IniciarSesion.html'">Iniciar Sesión</button>
    </header>
    <main class="contenido-principal">
        <div class="titulo-lineas">
            <div id="carouselPrincipal" class="carrusel" role="region" aria-label="Imágenes de la escuela">
                <div class="carrusel-lista">
                    <div class="carrusel-slide activo" aria-hidden="false">
                        <img src="Estilo/Imagenes/Fondo-Escuela.png" alt="Vista de la escuela">
                    </div>
                    <div class="carrusel-slide" aria-hidden="true">
                        <img src="Estilo/Imagenes/Carrusel-2.jpg" alt="Otra vista de la escuela">
                    </div>
                    <div class="carrusel-slide" aria-hidden="true">
                        <img src="../PaginaPRoA-Noticias/actolol.jpg" alt="Actividades de la escuela">
                    </div>
                </div>
                <button class="carrusel-control anterior" type="button" data-direccion="-1" aria-label="Imagen anterior">
                    <span aria-hidden="true"></span>
                </button>
                <button class="carrusel-control siguiente" type="button" data-direccion="1" aria-label="Imagen siguiente">
                    <span aria-hidden="true"></span>
                </button>
            </div>
        </div>
        <div class="contenido-texto">
            <h1>La escuela PRoA tiene una duración de 6 años y foco en enseñar a programar, empezando desde segundo año con lo básico, con un modelo innovador y profesores con ideas únicas.</h1>
        </div>
        <div class="galeria-articulos">
            <article class="imagenes">
                <img src="Estilo/Imagenes/lokr.jpg" alt="Imagen de la escuela por dentro" width="400" height="300">
                <br><br>
            </article>
            <article class="imagenes">
                <br><br>
                <img src="Estilo/Imagenes/oniet.jpg" alt="Imagen de los alumnos en un viaje a onniet" width="400" height="300">
                <br><br>
            </article>
            <article class="imagenes">
                <br><br>
                <img src="Estilo/Imagenes/mascotafullwallet.png" alt="Imagen de los alumnos en un viaje a onniet" width="400" height="300">
                <br><br>
            </article>
        </div>
    </main>
</body>
</html>
