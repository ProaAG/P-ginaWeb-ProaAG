<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><rect width="1200" height="1500" fill="#fff"/><rect x="55" y="55" width="1090" height="1390" rx="24" fill="none" stroke="#245e74" stroke-width="5"/><rect x="55" y="55" width="1090" height="220" rx="20" fill="#e8f3f6"/><text x="100" y="135" font-family="Arial" font-size="34" font-weight="bold" fill="#173f52">ESCUELA EXPERIMENTAL PRoA</text><text x="100" y="205" font-family="Arial" font-size="45" font-weight="bold" fill="#245e74">ACUERDOS DE CONVIVENCIA</text><text x="95" y="340" font-family="Arial" font-size="23" fill="#526775">Resumen orientativo de principios generales. No reemplaza el acuerdo institucional vigente.</text><circle cx="125" cy="432" r="24" fill="#69a9ba"/><text x="125" y="440" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#fff">1</text><text x="175" y="435" font-family="Arial" font-size="25" fill="#30495a">Tratar con respeto a todas las personas de la comunidad educativa.</text><circle cx="125" cy="557" r="24" fill="#69a9ba"/><text x="125" y="565" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#fff">2</text><text x="175" y="560" font-family="Arial" font-size="25" fill="#30495a">Cuidar los espacios, materiales y recursos compartidos.</text><circle cx="125" cy="682" r="24" fill="#69a9ba"/><text x="125" y="690" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#fff">3</text><text x="175" y="685" font-family="Arial" font-size="25" fill="#30495a">Asistir a clases y participar responsablemente de las actividades.</text><circle cx="125" cy="807" r="24" fill="#69a9ba"/><text x="125" y="815" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#fff">4</text><text x="175" y="810" font-family="Arial" font-size="25" fill="#30495a">Escuchar, dialogar y resolver los conflictos de manera pacífica.</text><circle cx="125" cy="932" r="24" fill="#69a9ba"/><text x="125" y="940" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#fff">5</text><text x="175" y="935" font-family="Arial" font-size="25" fill="#30495a">Respetar los acuerdos de uso de dispositivos y entornos digitales.</text><circle cx="125" cy="1057" r="24" fill="#69a9ba"/><text x="125" y="1065" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#fff">6</text><text x="175" y="1060" font-family="Arial" font-size="25" fill="#30495a">Comunicar situaciones que afecten el bienestar o la seguridad.</text><circle cx="125" cy="1182" r="24" fill="#69a9ba"/><text x="125" y="1190" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#fff">7</text><text x="175" y="1185" font-family="Arial" font-size="25" fill="#30495a">Cumplir las pautas institucionales y solicitar orientación cuando sea necesario.</text><rect x="95" y="1330" width="1000" height="65" rx="12" fill="#f0f7f9"/><text x="125" y="1370" font-family="Arial" font-size="21" fill="#245e74">Solicitá en secretaría la versión oficial y completa del acuerdo.</text></svg>